<h1 class="doc-title">경 위 서</h1>
<table>
<tr><th>소 속</th><td>{{dept}}</td><th>직 위</th><td>{{position}}</td><th>성 명</th><td>{{name}}</td></tr>
<tr><th>건 명</th><td colspan="5">{{summary}}</td></tr>
<tr><th>발생일시</th><td colspan="2">{{incident_date}}</td><th>발생장소</th><td colspan="2">{{place}}</td></tr>
<tr><th>관 련 자</th><td colspan="5">{{people}}</td></tr>
</table>
<p style="margin:0 0 2mm;font-weight:700">1. 경위</p><div class="box" style="min-height:70mm" data-grow="3">{{detail}}</div>
<p style="margin:0 0 2mm;font-weight:700">2. 조치 사항 및 향후 계획</p><div class="box" style="min-height:30mm" data-grow="1">{{action}}</div>
<p>위 내용은 사실과 다름이 없음을 확인합니다.</p>
<p class="date-line" style="margin:6mm 0">{{submit_date|date}}</p>
<div class="sign">작성자 &nbsp; {{name}} <span class="seal">(서명 또는 인)</span></div>
<p class="to">{{recipient}}</p>
