<h1 class="doc-title">시 말 서</h1>
<table>
<tr><th>소 속</th><td>{{dept}}</td><th>직 위</th><td>{{position}}</td><th>성 명</th><td>{{name}}</td></tr>
<tr><th>일 시</th><td colspan="2">{{incident_date}}</td><th>장 소</th><td colspan="2">{{place}}</td></tr>
<tr><th>건 명</th><td colspan="5">{{summary}}</td></tr>
</table>
<p style="margin:0 0 2mm;font-weight:700">1. 경위</p><div class="box" style="min-height:44mm" data-grow="2">{{detail}}</div>
<p style="margin:0 0 2mm;font-weight:700">2. 원인</p><div class="box" style="min-height:24mm" data-grow="1">{{cause}}</div>
<p style="margin:0 0 2mm;font-weight:700">3. 반성 및 재발 방지 대책</p><div class="box" style="min-height:30mm" data-grow="1">{{plan}}</div>
<p>본인은 위 사실에 대하여 시말서를 제출합니다.</p>
<p class="date-line" style="margin:6mm 0">{{submit_date|date}}</p>
<div class="sign">작성자 &nbsp; {{name}} <span class="seal">(서명 또는 인)</span></div>
<p class="to">{{recipient}}</p>
