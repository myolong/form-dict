<h2>월간 계획표 쓰는 법</h2>
<ol>
<li><b>연월</b>을 고르면 그 달의 달력이 자동으로 만들어집니다. 비워 두면 이번 달입니다.</li>
<li><b>날짜별 일정</b>은 <code>5 / 병원 10시</code>처럼 날짜와 일정을 한 줄씩 적습니다. 같은 날짜를 여러 번 적으면 한 칸에 함께 들어갑니다.</li>
<li>일요일은 빨간색, 토요일은 파란색 숫자로 표시됩니다. 공휴일은 직접 적어 주세요.</li>
<li>한 주씩 자세히 계획하려면 <a href="/jugan-gyehoek/">주간 계획표</a>를 함께 쓰세요.</li>
</ol>
