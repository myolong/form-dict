<h1 class="doc-title" style="margin-bottom:6mm">업 무 일 지</h1>
{{approval_box}}
<table>
<tr><th>날 짜</th><td>{{work_date|date}}</td><th>부 서</th><td>{{dept}}</td></tr>
<tr><th>직 위</th><td>{{position}}</td><th>성 명</th><td>{{name}}</td></tr>
</table>
<table>
<tr><th style="height:70mm" data-grow="3">오늘 한 일</th><td style="white-space:pre-wrap;vertical-align:top">{{done}}</td></tr>
<tr><th style="height:25mm" data-grow="1">진행 중인 일</th><td style="white-space:pre-wrap;vertical-align:top">{{ongoing}}</td></tr>
<tr><th style="height:30mm" data-grow="1">내일 할 일</th><td style="white-space:pre-wrap;vertical-align:top">{{tomorrow}}</td></tr>
<tr><th style="height:20mm" data-grow="1">특이사항<br><span class="small">·건의</span></th><td style="white-space:pre-wrap;vertical-align:top">{{issue}}</td></tr>
</table>
