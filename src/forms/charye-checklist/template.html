<h1 class="doc-title" style="margin-bottom:4mm">{{__year}} 설 차례 준비 체크리스트</h1>
<table class="tight"><tr><th>설 날</th><td>{{__seol0}}</td><th>장 소</th><td>{{place}}</td></tr>
<tr><th>모이는 사람</th><td colspan="3">{{who}}</td></tr></table>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:4mm;align-items:start">
<table class="tight tight2" style="margin:0"><tr><th colspan="2" style="text-align:center">일주일 전 · {{__seolm7}}</th></tr>{{c_w1|check6}}</table>
<table class="tight tight2" style="margin:0"><tr><th colspan="2" style="text-align:center">사흘 전 · {{__seolm3}}</th></tr>{{c_d3|check6}}</table>
<table class="tight tight2" style="margin:0"><tr><th colspan="2" style="text-align:center">설 전날 · {{__seolm1}}</th></tr>{{c_d1|check6}}</table>
<table class="tight tight2" style="margin:0"><tr><th colspan="2" style="text-align:center">설날 아침 · {{__seol0}}</th></tr>{{c_d0|check6}}</table>
<table class="tight tight2" style="margin:0"><tr><th colspan="2" style="text-align:center">차례상에 올릴 것</th></tr>{{c_table|check6}}</table>
<table class="tight tight2" style="margin:0"><tr><th colspan="2" style="text-align:center">설 지나고</th></tr>{{c_after|check6}}</table>
</div>
<table style="margin-top:4mm"><tr><th style="height:12mm" data-grow="1">역할 나누기<br>· 메모</th><td style="white-space:pre-wrap;vertical-align:top">{{memo}}</td></tr></table>
