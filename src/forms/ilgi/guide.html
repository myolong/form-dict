<h2>일기 양식 쓰는 법</h2>
<ol>
<li><b>날짜·날씨·기분</b>을 고르면 위쪽 칸에 들어갑니다.</li>
<li><b>오늘 있었던 일</b>을 적으면 줄 노트 위에 글이 들어갑니다. 내용이 짧으면 남는 줄은 손으로 더 써도 됩니다.</li>
<li><b>감사한 일 3가지</b>는 작은 것이라도 좋습니다. 매일 쓰면 기분이 가라앉은 날에도 하루를 정리하는 데 도움이 됩니다.</li>
<li>손으로 쓰고 싶으면 <b>빈 양식 인쇄</b>를 눌러 여러 장 뽑아 두세요.</li>
</ol>
<p>입력 내용은 서버로 보내지 않고 이 브라우저에만 저장됩니다.</p>
