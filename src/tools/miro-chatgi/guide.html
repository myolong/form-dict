<h2>이렇게 쓰세요</h2>
<ol><li>난이도를 고릅니다. 쉬움은 칸이 크고 길이 짧아요.</li>
<li>왼쪽 위 '출발'에서 오른쪽 아래 '도착'까지 연필로 길을 그어요.</li></ol>
<h2>진행 요령</h2>
<p>막다른 길에 들어가도 지우개로 지우고 다시 하면 된다고 말씀드려 주세요. 손가락으로 먼저 길을 따라가 본 다음 선을 그으면 덜 헤매요.</p>
