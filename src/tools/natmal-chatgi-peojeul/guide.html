<h2>이렇게 쓰세요</h2>
<ol><li>주제를 고릅니다. '골고루'를 고르면 장마다 주제가 바뀌어요.</li>
<li>표 위에 적힌 낱말을 표에서 찾아 동그라미하고, 찾은 낱말은 위 목록에서 지워 나가요.</li></ol>
<h2>진행 요령</h2>
<p>찾기 전에 낱말 목록을 함께 소리 내어 읽고, "사과 하면 생각나는 게 있으세요?"처럼 낱말마다 짧게 이야기를 나누면 좋아요. 첫 글자를 먼저 찾고 그 옆 글자를 확인하는 방법을 알려 드리면 훨씬 수월해집니다.</p>
