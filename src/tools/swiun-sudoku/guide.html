<h2>이렇게 쓰세요</h2>
<ol><li>난이도를 고릅니다. 처음이면 4×4 '쉬움'(빈칸 5개)으로 시작하세요.</li>
<li>'아주 크게'는 한 장에 퍼즐 1개, '크게'는 2개가 들어가요.</li></ol>
<h2>푸는 방법 알려 드리기</h2>
<ul><li>가로 한 줄에 1, 2, 3, 4가 한 번씩 들어가요.</li>
<li>세로 한 줄에도 한 번씩 들어가요.</li>
<li>굵은 선으로 나뉜 작은 네모 안에도 한 번씩 들어가요.</li></ul>
<p>숫자가 세 개 채워진 줄부터 찾아보면 빈칸 하나가 바로 풀려요. 이 방법을 첫 문제에서 함께 해 보세요.</p>
