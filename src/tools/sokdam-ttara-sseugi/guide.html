<h2>이렇게 쓰세요</h2>
<ol><li>활동을 고릅니다. '흐린 글씨 따라 쓰기'는 글씨 연습, '뒷부분 채워 쓰기'는 기억을 떠올리는 퀴즈예요.</li>
<li>난이도에 따라 짧은 속담(쉬움)부터 긴 속담(어려움)까지 나옵니다.</li>
<li>한 장에 들어가는 만큼만 넣기 때문에 속담 길이에 따라 개수가 달라져요.</li></ol>
<h2>진행 요령</h2>
<p>속담을 다 쓰고 나서 "이 속담은 언제 쓰셨어요?"라고 여쭤보면 옛이야기가 자연스럽게 나와요. 뒷부분 채우기에서 생각이 안 나시면 첫 글자를 알려 드리세요.</p>
