<h2>이렇게 쓰세요</h2>
<ol><li>날짜를 활동하는 날로 맞춥니다(기본은 오늘).</li>
<li>난이도를 고릅니다. '쉬움'은 보기에 동그라미, '보통'은 빈칸 쓰기, '어려움'은 어제·내일까지 써요.</li>
<li>이 활동지는 어르신이 직접 날짜를 쓰는 것이라 위쪽에 날짜를 인쇄하지 않습니다.</li></ol>
<h2>진행 요령</h2>
<p>하루를 시작할 때 달력과 창밖을 함께 보며 쓰면 좋아요. 다 쓴 뒤 "오늘 점심은 뭘까요?"처럼 하루 일정을 이야기 나누면 자연스럽게 하루가 열립니다.</p>
