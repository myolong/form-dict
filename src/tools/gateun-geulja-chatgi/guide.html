<h2>이렇게 쓰세요</h2>
<ol><li>찾을 것(글자·숫자)과 난이도를 고릅니다.</li>
<li>안내 문장에 동그라미로 표시된 글자를 표에서 모두 찾아 동그라미해요.</li>
<li>다 찾으면 모두 몇 개인지 세어 적습니다. 정답지에 개수가 나와요.</li></ol>
<h2>진행 요령</h2>
<p>한 줄씩 왼쪽에서 오른쪽으로 손가락으로 짚어 가며 찾으면 빠뜨리는 칸이 줄어요. 개수가 정답과 다르면 한 줄씩 다시 확인해 보는 것도 좋은 활동이 됩니다.</p>
