<h2>이렇게 쓰세요</h2>
<ol><li>난이도를 고르면 한 줄에 5~6개의 수가 나오고 그중 빈칸이 있어요.</li>
<li>앞뒤 숫자를 소리 내어 읽으며 규칙을 찾도록 안내하세요.</li></ol>
<h2>진행 요령</h2>
<p>처음 한 줄은 "하나, 둘, 셋…" 하고 함께 세어 보세요. 10씩 뛰어 세기는 "십, 이십, 삼십"처럼 돈을 세는 것과 같다고 말씀드리면 쉽게 따라오세요.</p>
